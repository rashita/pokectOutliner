<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pocket Outliner</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><span id="name">名称未設定</span><nav><button id="new" title="新規ウィンドウ ⌘N">＋</button><button id="open" title="開く ⌘O">開く</button><button id="save" title="保存 ⌘S">保存</button><button id="help" aria-label="操作ガイド">?</button></nav></header>
<main id="outline" aria-label="アウトライン"></main>
<footer><span id="status"></span><span id="format"></span></footer>
<dialog id="guide"><h2>操作</h2><p>↑ ↓　行を移動<br>Enter　行を追加<br>Tab / Shift Tab　階層を変更<br>⌥ ↑ ↓　子孫ごとブロックを移動<br>⌘ Enter　開く / 折りたたむ<br>⌘ Z / ⇧⌘ Z　元に戻す / やり直す<br>⌘ O　ファイルを開く<br>⌘ N　新規ウィンドウ<br>⌘ S　保存<br>⇧⌘ S　名前を付けて保存</p><p>左端の点をドラッグすると、対象行の前へ<br>子孫ごと移動します。</p><button id="dismiss-help">閉じる</button></dialog>
<dialog id="unsaved"><h2>変更を保存しますか？</h2><p>保存しない変更は失われます。</p><div><button data-choice="cancel">キャンセル</button><button data-choice="discard">保存しない</button><button data-choice="save">保存</button></div></dialog>
<script type="module" src="app.js"></script></body></html>
